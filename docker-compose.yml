services:
  db:
    image: postgres:16-alpine
    container_name: jitterbit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jitterbit_orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jitterbit_orders"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
